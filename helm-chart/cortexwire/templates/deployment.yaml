apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cortexwire
  labels:
    app: cortexwire
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cortexwire
  template:
    metadata:
      labels:
        app: cortexwire
    spec:
      containers:
        - name: cortexwire
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
